name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      target:
        description: Componente a publicar
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy_api:
    name: Publicar API no Render
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'web')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Verificar hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "::error::Configure o secret RENDER_DEPLOY_HOOK_URL antes de publicar a API."; exit 1; }

      - name: Acionar deploy da API
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --request POST "$RENDER_DEPLOY_HOOK_URL"

  deploy_web:
    name: Publicar PWA na Vercel
    needs: deploy_api
    if: >-
      always() &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') &&
      (needs.deploy_api.result == 'success' || needs.deploy_api.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.target != 'api')
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Verificar hook da Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          test -n "$VERCEL_DEPLOY_HOOK_URL" || { echo "::error::Configure o secret VERCEL_DEPLOY_HOOK_URL antes de publicar a PWA."; exit 1; }

      - name: Acionar deploy da PWA
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl --fail --show-error --silent --retry 3 --retry-all-errors --request POST "$VERCEL_DEPLOY_HOOK_URL"
